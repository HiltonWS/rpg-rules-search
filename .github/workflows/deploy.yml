name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deployment secrets
        if: ${{ secrets.RPI_HOST == '' || secrets.RPI_USER == '' || secrets.RPI_SSH_KEY == '' }}
        run: |
          echo "Skipping deployment because one or more required secrets are not configured: RPI_HOST, RPI_USER, RPI_SSH_KEY"
          echo "Set those secrets in GitHub repository settings before enabling deployment."

      - name: Deploy to Raspberry Pi over SSH
        if: ${{ secrets.RPI_HOST != '' && secrets.RPI_USER != '' && secrets.RPI_SSH_KEY != '' }}
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key: ${{ secrets.RPI_SSH_KEY }}
          script: |
            set -euo pipefail
            export REPO_URL="${{ secrets.REPO_URL }}"
            if [ -z "$REPO_URL" ]; then
              export REPO_URL="https://github.com/${{ github.repository }}.git"
            fi
            export BRANCH="main"
            export APP_DIR="/opt/rpg-rules-search"
            export USER_NAME="${{ secrets.RPI_USER }}"
            echo "Deploying from $REPO_URL"
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/deploy.sh" -o /tmp/deploy.sh
            bash /tmp/deploy.sh
