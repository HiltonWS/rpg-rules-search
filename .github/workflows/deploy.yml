name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Raspberry Pi over SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.RPI_HOST }}
          username: ${{ secrets.RPI_USER }}
          key: ${{ secrets.RPI_SSH_KEY }}
          script: |
            export REPO_URL="${{ secrets.REPO_URL }}"
            if [ -z "$REPO_URL" ]; then
              export REPO_URL="https://github.com/hilton/rpg-rules-search.git"
            fi
            export BRANCH="main"
            export APP_DIR="/opt/rpg-rules-search"
            export USER_NAME="${{ secrets.RPI_USER }}"
            curl -fsSL "https://raw.githubusercontent.com/hilton/rpg-rules-search/main/scripts/deploy.sh" | bash
