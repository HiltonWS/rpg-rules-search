[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rpg-rules-search"
version = "0.1.0"
description = "Local-first search for licensed RPG rulebooks stored locally or in Google Drive"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "google-api-python-client>=2.177,<3",
  "google-auth-oauthlib>=1.2,<2",
  "jinja2>=3.1,<4",
  "pydantic-settings>=2.10,<3",
  "pymupdf>=1.26,<2",
  "python-docx>=1.2,<2",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "mcp>=1.26,<2",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rpg_rules_search"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
ignore = ["B008"]
